spring:
  application:
    name: seathappens

  datasource:
    url: jdbc:postgresql://localhost:5432/seathappens
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: seathappens-local-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

seathappens:
  outbox:
    publisher-fixed-rate-ms: 10000
    topic-name: seathappens.events
    max-retry-count: 5
    retry-delay-ms: 30000

  reservation:
    duration-minutes: 10
    expiry-scheduler-fixed-rate-ms: 30000

  order:
    expiry-scheduler-fixed-rate-ms: 30000

  notification:
    default-recipient: customer@seathappens.local

  security:
    jwt:
      secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      expiration-minutes: 60